experiment_name: "exp_02_fintech_weekly_life"
description: "AI 학습용: 7일간의 주간 주기 패턴 및 평일 핫딜 이벤트 시뮬레이션"
target_table: "orders"
pg_state:
  table_size_mb: 10240 # 10GB Base
  active_connections: 500
  p99_time_ms: 15.0
  current_tps: 3000.0
  replication_lag_s: 0.1
sqlite_history:
  days: 7
  interval_minutes: 1 # 1분 단위 고정밀 데이터 (총 10,080개 포인트)
  base_tps: 500.0
  peak_tps: 4500.0
  weekly_pattern: true # 주말 트래픽 감소 반영
  noise_variance: 0.1  # 10% 랜덤 노이즈
  events:
    - name: "Monday Morning Rush"
      start_day: 0
      start_hour: 9
      duration_h: 2
      multiplier: 1.5
    - name: "Wednesday Flash Sale"
      start_day: 2
      start_hour: 20
      duration_h: 1
      multiplier: 3.2
    - name: "Friday Night Fever"
      start_day: 4
      start_hour: 22
      duration_h: 3
      multiplier: 2.0

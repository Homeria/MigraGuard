services:
  # 🐘 Target Database (PostgreSQL)
  db:
    image: postgres:15-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: target_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d target_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./build/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  # 🛡️ MigraGuard Agent (Background Metrics Collector)
  agent:
    build:
      context: .
      dockerfile: build/docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    command: ["agent", "--tables", "orders,products,users"]
    volumes:
      - migraguard-data:/app/data
      - ./migraguard.yaml:/app/migraguard.yaml
    restart: always

  # 🧪 Load Generator (Traffic Simulator)
  load-generator:
    build:
      context: .
      dockerfile: build/docker/Dockerfile
    entrypoint: ["/app/loadgen"]
    command: ["--db", "postgres://user:pass@db:5432/target_db", "--conns", "15", "--profile", "steady"]
    depends_on:
      db:
        condition: service_healthy
    restart: always

  # 🔍 MigraGuard Analyzer (On-demand Analysis)
  analyze:
    build:
      context: .
      dockerfile: build/docker/Dockerfile
    profiles:
      - tools
    volumes:
      - migraguard-data:/app/data
      - ./migraguard.yaml:/app/migraguard.yaml
      - .:/app/code

volumes:
  migraguard-data:
    driver: local
  postgres-data:
    driver: local

experiment_name: "exp_19_maintenance_window"
description: "Simulated system maintenance interval triggering drop in user traffic to near-zero."
target_table: "orders"
pg_state:
  table_size_mb: 2048
  active_connections: 5
  p99_time_ms: 2.0
  current_tps: 2.0
  replication_lag_s: 0.0
sqlite_history:
  days: 7
  interval_minutes: 2
  base_tps: 500.0
  peak_tps: 1200.0
  weekly_pattern: true
  noise_variance: 0.05
  asymmetric_skew: 0.1
  peak_shift_hours: 0.1
  events:
    - name: "Scheduled System Maintenance"
      start_day: 3
      start_hour: 1
      duration_h: 4
      multiplier: 0.01

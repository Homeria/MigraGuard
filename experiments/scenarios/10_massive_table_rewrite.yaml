experiment_name: "exp_10_massive_table_rewrite"
description: "Long-term data gathering for microservice with highly bloated tables requiring large rewrites."
target_table: "orders"
pg_state:
  table_size_mb: 512000
  active_connections: 50
  p99_time_ms: 20.0
  current_tps: 800.0
  replication_lag_s: 0.1
sqlite_history:
  days: 30
  interval_minutes: 10
  base_tps: 500.0
  peak_tps: 1200.0
  weekly_pattern: true
  noise_variance: 0.05
  asymmetric_skew: 0.1
  peak_shift_hours: 0.2
  events: []

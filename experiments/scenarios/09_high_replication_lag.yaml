experiment_name: "exp_09_high_replication_lag"
description: "연구용: 복제 지연(Replication Lag)이 락 블로킹 기간을 연장시키는 현상 관찰"
target_table: "order_event_logs"
pg_state:
  table_size_mb: 5120
  active_connections: 120
  p99_time_ms: 45.0
  current_tps: 1500.0
  replication_lag_s: 30.0 # 30초의 극심한 지연
sqlite_history:
  days: 7
  interval_minutes: 1
  base_tps: 1000.0
  peak_tps: 2000.0
  weekly_pattern: false
  noise_variance: 0.05
  events: []

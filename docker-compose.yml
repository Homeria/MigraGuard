services:
  # 🐘 Target Database (PostgreSQL)
  # Mimics the production environment
  db:
    image: postgres:15-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: target_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d target_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  # 🛡️ MigraGuard Agent (Background Metrics Collector)
  # Collects metrics periodically and stores them in SQLite
  agent:
    build: .
    depends_on:
      db:
        condition: service_healthy
    command: ["agent", "--db", "postgres://user:pass@db:5432/target_db", "--sqlite", "/app/data/migraguard.db", "--interval", "10", "--tables", "orders,products,users"]
    volumes:
      - migraguard-data:/app/data
    restart: always

  # 🧪 Load Generator (Traffic Simulator)
  # Simulates e-commerce traffic to generate workload
  load-generator:
    build: .
    entrypoint: ["/app/loadgen"]
    command: ["--db", "postgres://user:pass@db:5432/target_db", "--conns", "15", "--profile", "steady"]
    depends_on:
      db:
        condition: service_healthy
    restart: always

  # 🔍 MigraGuard Analyzer (On-demand Analysis)
  # This service is triggered manually via:
  # docker compose run --rm analyze analyze [file_path]
  analyze:
    build: .
    profiles:
      - tools
    volumes:
      - migraguard-data:/app/data
      - .:/app/code
    # No permanent command needed; runs the default ENTRYPOINT (migraguard)

volumes:
  migraguard-data:
    driver: local
  postgres-data:
    driver: local

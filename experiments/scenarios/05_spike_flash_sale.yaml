experiment_name: "exp_05_spike_flash_sale"
description: "Extreme marketing event spikes to evaluate sudden high-tps system thresholds."
target_table: "inventory_stocks"
pg_state:
  table_size_mb: 512
  active_connections: 450
  p99_time_ms: 50.0
  current_tps: 4500.0
  replication_lag_s: 0.2
sqlite_history:
  days: 7
  interval_minutes: 1
  base_tps: 300.0
  peak_tps: 1500.0
  weekly_pattern: false
  noise_variance: 0.15
  asymmetric_skew: 0.5
  peak_shift_hours: 0.3
  events:
    - name: "Flash Sale 1"
      start_day: 1
      start_hour: 20
      duration_h: 1
      multiplier: 8.5
    - name: "Flash Sale 2"
      start_day: 3
      start_hour: 12
      duration_h: 1
      multiplier: 10.0
    - name: "Weekend Event"
      start_day: 6
      start_hour: 18
      duration_h: 4
      multiplier: 3.5

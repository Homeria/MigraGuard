experiment_name: "exp_20_global_follow_the_sun"
description: "Global cloud platform workload with three overlapping regional daytime traffic waves."
target_table: "orders"
pg_state:
  table_size_mb: 40960
  active_connections: 300
  p99_time_ms: 28.0
  current_tps: 900.0
  replication_lag_s: 0.25
sqlite_history:
  days: 7
  interval_minutes: 2
  base_tps: 400.0
  peak_tps: 1200.0
  weekly_pattern: false
  noise_variance: 0.08
  asymmetric_skew: 0.15
  peak_shift_hours: 0.3
  events:
    - name: "Asia Peak Surge"
      start_day: 1
      start_hour: 12
      duration_h: 3
      multiplier: 1.3
    - name: "Europe Peak Surge"
      start_day: 1
      start_hour: 20
      duration_h: 3
      multiplier: 1.2
    - name: "Americas Peak Surge"
      start_day: 2
      start_hour: 4
      duration_h: 3
      multiplier: 1.4

experiment_name: "exp_01_micro_startup_steady"
description: "Early-stage startup with highly predictable, low-volume, and steady traffic patterns."
target_table: "orders"
pg_state:
  table_size_mb: 512
  active_connections: 15
  p99_time_ms: 8.0
  current_tps: 15.0
  replication_lag_s: 0.0
sqlite_history:
  days: 7
  interval_minutes: 1
  base_tps: 15.0
  peak_tps: 50.0
  weekly_pattern: true
  noise_variance: 0.08
  asymmetric_skew: 0.05
  peak_shift_hours: 0.1
  events: []

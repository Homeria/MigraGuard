experiment_name: "exp_21_time_recommendation_orders"
description: "Orders workload with a clear low-traffic deployment window and daytime peak for time recommendation evaluation."
target_table: "orders"
pg_state:
  table_size_mb: 2048
  active_connections: 20
  p99_time_ms: 8.0
  current_tps: 800.0
  replication_lag_s: 0.1
sqlite_history:
  days: 7
  interval_minutes: 2
  base_tps: 300.0
  peak_tps: 5000.0
  weekly_pattern: false
  noise_variance: 0.03
  asymmetric_skew: 0.1
  peak_shift_hours: 0.1
  events:
    - name: "Lunch Checkout Peak"
      start_day: 1
      start_hour: 12
      duration_h: 2
      multiplier: 1.7
    - name: "Lunch Checkout Peak 2"
      start_day: 3
      start_hour: 12
      duration_h: 2
      multiplier: 1.7
    - name: "Evening Checkout Peak"
      start_day: 5
      start_hour: 20
      duration_h: 2
      multiplier: 1.5

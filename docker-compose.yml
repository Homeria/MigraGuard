services:
  # 🐘 Target Database (PostgreSQL)
  # 운영 환경을 모사하는 타겟 데이터베이스
  db:
    image: postgres:15-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: target_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d target_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  # 🛡️ MigraGuard Agent (Background Metrics Collector)
  # 주기적으로 DB 지표를 수집하여 공유 SQLite에 저장
  agent:
    build: .
    depends_on:
      db:
        condition: service_healthy
    command: ["agent", "--db", "postgres://user:pass@db:5432/target_db", "--sqlite", "/app/data/migraguard.db", "--interval", "10", "--tables", "orders,products,users"]
    volumes:
      - migraguard-data:/app/data
    restart: always

  # 🧪 Load Generator (Traffic Simulator)
  # 이커머스 트래픽을 모사하여 실제 부하를 유발함
  load-generator:
    build: .
    # [수정] migraguard 대신 별도로 빌드된 loadgen 바이너리 실행
    entrypoint: ["/app/loadgen"]
    command: ["--db", "postgres://user:pass@db:5432/target_db", "--conns", "15", "--profile", "steady"]
    depends_on:
      db:
        condition: service_healthy
    restart: always

  # 🔍 MigraGuard Analyze (CLI Shell)
  analyze-shell:
    build: .
    volumes:
      - migraguard-data:/app/data
      - .:/app/code
    command: ["tail", "-f", "/dev/null"]

volumes:
  migraguard-data:
    driver: local
  postgres-data:
    driver: local
